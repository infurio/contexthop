name: Homebrew installation

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Verify the published version on a fresh Mac
        run: |
          brew install infurio/tap/contexthop
          brew test infurio/tap/contexthop
          test "$(chop version)" = "contexthop ${TAG#v}"
