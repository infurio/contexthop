name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize different versions as well as retries so formula updates cannot race.
concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SHELL: /bin/zsh
      TAG: ${{ github.ref_name }}
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Require a stable semantic version
        run: '[[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate release notes
        run: python3 scripts/release/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Find successful full CI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release_ci.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Run full checks when CI cannot be reused
        if: steps.ci.outputs.reuse != 'true'
        run: |
          make ci
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Build the Apple Silicon release archive once
        run: python3 scripts/release/package_release.py "$TAG"
      - name: Verify archives and native binary
        run: python3 scripts/release/verify_release.py "$TAG"
      - name: Test Homebrew installation from local archives
        run: bash scripts/release/test-homebrew.sh "dist/$TAG/contexthop.rb" local
      - name: Save release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/${{ env.TAG }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      TAP_REPO: infurio/homebrew-tap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-release
          path: dist/${{ env.TAG }}
      - name: Recheck the exact artifacts to be published
        run: python3 scripts/release/verify_release.py "$TAG"
      - name: Publish verified binary assets
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/release/publish-release.sh

  update-tap:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      TAP_REPO: infurio/homebrew-tap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-release
          path: dist/${{ env.TAG }}
      - name: Install candidate formula using public release URLs
        run: bash scripts/release/test-homebrew.sh "dist/$TAG/contexthop.rb" published
      - name: Update the tap after public installation passes
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/release/update_tap.py "$TAG"

  verify-install:
    needs: update-tap
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Verify the public tap on a fresh runner
        run: |
          brew install infurio/tap/contexthop
          brew test infurio/tap/contexthop
          test "$(chop version)" = "contexthop ${TAG#v}"
          chop help

  source-release:
    needs: verify-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      TAP_REPO: infurio/homebrew-tap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Add source release notes and binary download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish-source-release.sh
